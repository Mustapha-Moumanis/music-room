[project]
name = "musicroom-backend"
version = "0.1.0"
description = "Music Room backend (FastAPI port of the NestJS service)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    "google-auth>=2.37",
    "fastapi-mail>=1.4",
    "slowapi>=0.1.9",
    "structlog>=24.4",
    "secure>=1.0",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "email-validator>=2.2",
    "aiosmtplib>=5.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "testcontainers[postgres]>=4.9",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# N811: SQLAlchemy convention imports `postgresql.ENUM as PgEnum`; the alias is a
# class, not a constant, but ruff can't tell. Allow the alias universally.
ignore = ["E501", "N811"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.*", "slowapi.*", "secure.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
