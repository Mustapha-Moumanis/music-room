name: musicroom

services:
  postgres:
    image: postgres:16-alpine
    container_name: musicroom-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    volumes:
      - musicroom-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - musicroom-network

  mailpit:
    image: axllent/mailpit
    container_name: musicroom-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "1025:1025"
    networks:
      - musicroom-network

  backend:
    build: ./backend
    container_name: musicroom-backend
    env_file: .env
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./backend:/code
      - /code/node_modules
    command: npm run start:dev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${BACKEND_PORT}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - musicroom-network

volumes:
  musicroom-db:

networks:
  musicroom-network:
